name: Android Release (Production)

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          echo $ENCODED_STRING | base64 -d > release.jks

      - name: Build Release APK and SBOM
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease cyclonedxBom \
            -PversionCode=${{ github.run_number }} \
            -PversionNameSuffix=.${{ github.run_number }}

      - name: Rename Artifacts
        run: |
          # Extract base version
          BASE_VERSION=$(grep 'val baseVersionName =' app/build.gradle.kts | cut -d '"' -f 2)
          FULL_VERSION=$BASE_VERSION.${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk HealthAutoSteps-v$FULL_VERSION.apk
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping-v$FULL_VERSION.txt
          fi
          # Rename SBOM files
          if [ -f app/build/reports/bom.json ]; then
            cp app/build/reports/bom.json bom-v$FULL_VERSION.json
          fi
          if [ -f app/build/reports/bom.xml ]; then
            cp app/build/reports/bom.xml bom-v$FULL_VERSION.xml
          fi
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Release v${{ env.FULL_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            HealthAutoSteps-v${{ env.FULL_VERSION }}.apk
            mapping-v${{ env.FULL_VERSION }}.txt
            bom-v${{ env.FULL_VERSION }}.json
            bom-v${{ env.FULL_VERSION }}.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
