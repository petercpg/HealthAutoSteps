name: Android Release (Production)

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          echo $ENCODED_STRING | base64 -d > release.jks

      - name: Build Release APK and SBOM
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease cyclonedxBom \
            -PversionCode=${{ github.run_number }} \
            -PversionNameSuffix=.${{ github.run_number }}

      - name: Rename Artifacts and Inject Hash
        run: |
          # Extract base version
          BASE_VERSION=$(grep 'val baseVersionName =' app/build.gradle.kts | cut -d '"' -f 2)
          FULL_VERSION=$BASE_VERSION.${{ github.run_number }}
          APK_NAME="HealthAutoSteps-v$FULL_VERSION.apk"

          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"

          # Calculate APK Hash
          APK_HASH=$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)
          echo "APK_HASH=$APK_HASH"

          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt mapping-v$FULL_VERSION.txt
          fi

          # Process JSON SBOM
          if [ -f app/build/reports/cyclonedx/bom.json ]; then
            jq --arg hash "$APK_HASH" '.metadata.component.hashes += [{"alg": "SHA-256", "content": $hash}]' app/build/reports/cyclonedx/bom.json > "bom-v$FULL_VERSION.json"
          fi

          # Process XML SBOM
          if [ -f app/build/reports/cyclonedx/bom.xml ]; then
            python3 -c "import sys, re; path=sys.argv[1]; sha=sys.argv[2]; ver=sys.argv[3]; content=open(path).read(); pattern=r'(<metadata>.*?<component.*?>)(.*?)(</component>)'; replacement=r'\1\2<hashes><hash alg=\"SHA-256\">' + sha + r'</hash></hashes>\3'; open(f'bom-v{ver}.xml', 'w').write(re.sub(pattern, replacement, content, flags=re.DOTALL))" app/build/reports/cyclonedx/bom.xml "$APK_HASH" "$FULL_VERSION"
          fi

          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'HealthAutoSteps-v${{ env.FULL_VERSION }}.apk'

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-path: 'HealthAutoSteps-v${{ env.FULL_VERSION }}.apk'
          sbom-path: 'bom-v${{ env.FULL_VERSION }}.json'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Release v${{ env.FULL_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            HealthAutoSteps-v${{ env.FULL_VERSION }}.apk
            mapping-v${{ env.FULL_VERSION }}.txt
            bom-v${{ env.FULL_VERSION }}.json
            bom-v${{ env.FULL_VERSION }}.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
